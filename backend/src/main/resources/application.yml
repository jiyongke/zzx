server:
  port: 8080

spring:
  application:
    name: orange-farm-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 修改为本机 MySQL 账号密码即可
    url: jdbc:mysql://localhost:3306/orange_farm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: jyk123123
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: orange-farm-traceability-secret-2026
  expire-hours: 24
